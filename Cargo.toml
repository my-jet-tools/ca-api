[package]
name = "ca-api"
version = "0.1.0"
edition = "2021"

[dependencies]
my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server.git", features = [
    "static-files",
    "macros",
] }

my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "hex",
    "base64",
    "with-tokio",
] }

my-logger = { tag = "1.2.1", git = "https://github.com/MyJetTools/my-logger.git" }

my-settings-reader = { tag = "0.5.0", git = "https://github.com/MyJetTools/my-settings-reader.git" }

tokio = { version = "*", features = ["full"] }
async-trait = "*"

pem = "*"

serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "*"

openssl = "*"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
time = "0.3"

# The encrypted state and journal: AES-256-GCM envelopes, as ip-whitelister keeps its data.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.3"
data-encoding = "2"

[dev-dependencies]
# The end-to-end tests call the API as a client does: encrypted bodies over the unix socket and TCP.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git", features = [
    "encryption",
] }
